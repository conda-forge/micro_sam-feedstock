{% set version = "2.0.1" %}
{% set python_min = "3.11" %}
{% set python_max = "3.15" %}

package:
  name: micro_sam
  version: {{ version }}

source:
  url: https://github.com/computational-cell-analytics/micro-sam/archive/v{{ version }}.tar.gz
  sha256: de56ae91fe413f313af76d28866cc8ea4f3f81978611daf9b3d146f4a8a5d5c3

build:
  entry_points:
    - micro_sam = micro_sam._cli:cli
  noarch: python
  number: 0
  script: pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=42
  run:
    - python >={{ python_min }},<{{ python_max }}
    - bioimage-cpp >=0.7
    - bioimage-py >=0.2.2
    - bioimageio.core >=0.11
    - click
    - h5py
    - huggingface_hub
    - imagecodecs
    - imageio
    - joblib
    - kornia
    - magicgui
    - matplotlib-base
    - napari >=0.7.1,<0.11
    - natsort
    - networkx
    - numpy
    - pandas
    - pooch
    - pydantic <2.14
    - pyqt6
    - python-elf >=0.9
    - python-xxhash
    - pytorch >=2.5
    # sam-2 provides the 'sam2' module (Segment Anything 2).
    - sam-2 >=1.0.0.20241215
    - scikit-image
    - scikit-learn
    - segment-anything >=1.0.1
    - superqt
    - tensordict
    - timm
    - torch_em >=0.10.8
    - torchvision
    - tqdm
    - trackastra >=0.5.3
    - transformers >=4.56
    - xarray
    - z5py >=3
    - zarr >=3

test:
  requires:
    - python {{ python_min }}
    - pytest
  # conda-build does not expand '**' recursively, so list each test folder.
  source_files:
    - test/*.py
    - test/test_models/*.py
  imports:
    - micro_sam
    - micro_sam.util
    - micro_sam.v1.util
    - micro_sam.v2.util
    - micro_sam.v2.instance_segmentation
    - micro_sam.v2.automatic_prompt_generation
    - micro_sam.classical_features
    - micro_sam.v2.training
  commands:
    - micro_sam --help
    - micro_sam --version
    # Run a v2 subset that loads only the hvit_t weights. The deselected CLI test needs hvit_t_cells.
    - pytest -m "not v1 and not gui and not slow" --deselect test/test_cli.py::TestCLI::test_automatic_segmentation test/test_cli.py test/test_util.py test/test_models/test_peft_sam2.py test/test_models/test_unisam2.py test/test_v2_*.py

about:
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Segment Anything for Microscopy.
  home: https://github.com/computational-cell-analytics/micro-sam

extra:
  recipe-maintainers:
    - anwai98
    - constantinpape
